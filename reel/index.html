      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0b0b;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Archivo Black", sans-serif;
      }
      /* One shot = one full-screen ground. Only one is visible at a time; the timeline cuts between them. */
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
      }
      .cam,
      .punch,
      .layer {
        position: absolute;
        inset: 0;
      }
      /* Rows of type stack in the middle of the band the platform leaves uncovered. */
      .stage {
        position: absolute;
        left: 108px;
        right: 108px;
        top: 250px;
        bottom: 640px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 2;
      }
      .layer {
        z-index: 1;
      }
      .row {
        position: relative;
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        line-height: 0.92;
        text-transform: uppercase;
      }
      .row.text {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
      }
      .word {
        position: relative;
        display: inline-block;
      }
      .tag {
        padding: 0.14em 0.3em 0.1em;
        border: 7px solid currentColor;
      }
      .pill {
        padding: 0.22em 0.6em;
        border-radius: 999px;
      }
      .pin {
        position: absolute;
        width: 0;
        height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pin > * {
        flex-shrink: 0;
      }
      .mark {
        position: absolute;
        left: -4%;
        top: 0;
        width: 108%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      svg.pix {
        display: block;
        shape-rendering: crispEdges;
      }
      svg.scribble {
        display: block;
        overflow: visible;
      }
      .caption {
        position: absolute;
        left: 108px;
        right: 108px;
        top: 1330px;
        height: 130px;
        z-index: 3;
      }
      .capline {
        position: absolute;
        inset: 0;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: center;
        gap: 0 0.28em;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 46px;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .capline span {
        display: inline-block;
      }
      /* Stock footage under the scenes (the clips are written into the footage block by pipeline/video.py). */
      video.footage {
        position: absolute;
        object-fit: cover;
        z-index: 0;
      }
      /* The slap look over footage: the lyric line sits low in white with a dark edge. */
      .look-slap .caption {
        top: 1338px;
        left: 80px;
        right: 80px;
      }
      .look-slap .capline {
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-size: 44px;
        line-height: 1.18;
        letter-spacing: 0;
        color: #fff;
        -webkit-text-stroke: 9px #121210;
        paint-order: stroke fill;
      }
      /* The stitch look (lib/stitch.js): the frame is an embroidered cloth; the caption sits on a sewn strip. */
      .look-stitch .caption {
        top: 1330px;
        height: 110px;
        left: 70px;
        right: 70px;
      }
      .look-stitch .capline {
        font-family: "Baloo Bhai 2", sans-serif;
        font-weight: 800;
        font-size: 42px;
        line-height: 1.16;
        letter-spacing: 0.01em;
        color: #f0e4c9;
        align-content: center;
      }
      /* The weave of the cloth, over everything. */
      .look-stitch::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 5px),
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.07) 0 2px, transparent 2px 5px);
      }
      /* The circuit look (lib/circuit.js): a black, red-orange and bone HUD world, and its pastel idol twin. */
      .look-circuit .capline {
        font-family: "JetBrains Mono", monospace;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .look-idol .capline {
        font-family: "Mochiy Pop One", sans-serif;
        font-weight: 400;
        font-size: 42px;
      }
      .hud {

        inset: 0;
        z-index: 6;
        pointer-events: none;
        font-family: "JetBrains Mono", monospace;
        font-weight: 800;
        font-size: 21px;
        line-height: 1.5;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .hud > div {
        position: absolute;
      }
      .hud small {
        display: block;
        font-size: 17px;
        font-weight: 400;
      }
      .hud-corner {

        height: 26px;

        height: 880px;

      .hud-bars > i {

        background: currentColor;
        transform-origin: 50% 100%;
      }

      .cir-bubble {

        text-align: center;

        height: 40px;

        align-items: center;
        justify-content: center;

        text-shadow: 0 0.07em 0 rgba(176, 20, 90, 0.28);
      }
      /* The windows look (lib/windows.js): hairline windows, monospace type. */
      .look-windows .capline {
        font-family: "JetBrains Mono", monospace;
        font-weight: 400;
        font-size: 40px;
      }
      .win {
        flex-shrink: 0;
        border: 3px solid #3f74de;
        background: #f4f3ec;
        color: #151515;
        box-shadow: 10px 10px 0 rgba(107, 155, 239, 0.22);
        font-family: "JetBrains Mono", monospace;
        font-weight: 400;
        font-size: 26px;
        line-height: 1.25;
        text-transform: none;
        white-space: nowrap;
      }
      .win.dark {
        background: #0c0c0c;
        color: #f4f3ec;
      }
      .win-bar {
        display: flex;
        justify-content: space-between;
        gap: 30px;
        padding: 5px 12px;
        border-bottom: 3px solid #3f74de;
        font-size: 20px;
        color: #2f5fc4;
      }
      .win.dark .win-bar {
        color: #8fb4f5;
      }
      .win-glyph {
        font-weight: 800;
        line-height: 1;
        text-align: center;
        padding: 0 0.12em;
      }
      .win-cards {
        display: flex;
        gap: 14px;
      }
      .win.dark .win-fill {
        background: #f4f3ec;
      }
      .win-row {
        display: flex;
        justify-content: space-between;
        gap: 40px;
      }
      .win-track {
        height: 26px;
        border: 3px solid currentColor;
        padding: 3px;
      }
      .win-fill {
        width: 100%;
        height: 100%;
        background: #151515;
        transform-origin: 0 50%;
      }
      .win-note {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 22px;
      }
      .win-meter {
        display: flex;
        align-items: flex-end;
        gap: 6px;
      }
      .win-meter > div {
        flex: 1;
        height: 100%;
      }
      .win-ascii {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0.32;
      }
      .win-click {
        position: absolute;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border: 4px solid #6b9bef;
        border-radius: 50%;
        z-index: 4;
      }
      /* The collage look (lib/collage.js): torn tape, paper scraps, stickers over footage; the lyric on tape. */
      .look-collage .caption {
        top: 1336px;
        left: 70px;
        right: 70px;
      }
      .look-collage .capline {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 50px;
        line-height: 1.32;
        gap: 6px 10px;
        text-transform: uppercase;
        color: #141210;
      }
      .look-collage .capline span {
        background: #F6F0E2;
        padding: 0 0.22em;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      }
      /* Paper grain and a faint print texture over the whole frame. */
      .look-collage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        background-image:
          repeating-radial-gradient(circle at 17% 23%, rgba(255, 250, 235, 0.05) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.04) 0 1px, transparent 1px 4px);
      }

      // Type is measured to fit its row, so the fonts must be in before anything is built.
      Promise.all(R.fontFaces.map((face) => (Array.isArray(face) ? document.fonts.load(face[0], face[1]) : document.fonts.load(face)))).then(() => {
