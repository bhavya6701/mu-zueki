      * {

      html,

      /* One shot = one full-screen ground. Only one is visible at a time; the timeline cuts between them. */
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
      }
      .cam,
      .punch,
      .layer {
        position: absolute;

      /* Rows of type stack in the middle of the band the platform leaves uncovered. */

        position: absolute;
        left: 108px;
        right: 108px;
        top: 250px;
        bottom: 640px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 2;
      }
      .layer {
        z-index: 1;
      }
      .row {
        position: relative;
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        line-height: 0.92;
        text-transform: uppercase;

      .row.text {

        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
      }
      .word {
        position: relative;
        display: inline-block;
      }
      .tag {
        padding: 0.14em 0.3em 0.1em;
        border: 7px solid currentColor;
      }
      .pill {
        padding: 0.22em 0.6em;
        border-radius: 999px;
      }
      .pin {
        position: absolute;
        width: 0;
        height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pin > * {
        flex-shrink: 0;

      .mark {
        position: absolute;
        left: -4%;
        top: 0;
        width: 108%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      /* pixelfx effects (lib/pfx.js): small canvases scaled up with crisp pixels. */
      .pfx-box {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      canvas.pfx {
        position: absolute;
        image-rendering: pixelated;
      }
      svg.pix {
        display: block;
        shape-rendering: crispEdges;
      }
      svg.scribble {
        display: block;
        overflow: visible;
      }
      .caption {
        position: absolute;
        left: 108px;
        right: 108px;
        top: 1330px;
        height: 130px;
        z-index: 3;
      }
      .capline {
        position: absolute;
        inset: 0;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: center;
        gap: 0 0.28em;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 46px;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .capline span {
        display: inline-block;
      }
      /* Stock footage under the scenes (the clips are written into the footage block by pipeline/video.py). */
      video.footage {
        position: absolute;
        object-fit: cover;
        z-index: 0;
      }
      /* The slap look over footage: the lyric line sits low in white with a dark edge. */
      .look-slap .caption {
        top: 1338px;
        left: 80px;
        right: 80px;
      }
      .look-slap .capline {
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-size: 44px;
        line-height: 1.18;
        letter-spacing: 0;
        color: #fff;
        -webkit-text-stroke: 9px #121210;
        paint-order: stroke fill;
      }
      /* The stitch look (lib/stitch.js): the frame is an embroidered cloth; the caption sits on a sewn strip. */
      .look-stitch .caption {
        top: 1330px;
        height: 110px;
        left: 70px;
        right: 70px;
      }
      .look-stitch .capline {
        font-family: "Baloo Bhai 2", sans-serif;
        font-weight: 800;
        font-size: 42px;
        line-height: 1.16;
        letter-spacing: 0.01em;
        color: #f0e4c9;
        align-content: center;
      }
      /* The weave of the cloth, over everything. */
      .look-stitch::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 5px),
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.07) 0 2px, transparent 2px 5px);

        font-size: 38px;
        letter-spacing: 0.02em;
        text-transform: uppercase;

      .win {

        font-size: 26px;
        line-height: 1.25;
        text-transform: none;
        white-space: nowrap;

      .win.dark {

      .win-bar {

        border-bottom: 3px solid #3f74de;
        font-size: 20px;
        color: #2f5fc4;
      }
      .win.dark .win-bar {
        color: #8fb4f5;
      }
      .win-glyph {
        font-weight: 800;
        line-height: 1;
        text-align: center;
        padding: 0 0.12em;
      }
      .win-cards {
        display: flex;
        gap: 14px;
      }
      .win.dark .win-fill {
        background: #f4f3ec;

      .win-row {
        display: flex;
        justify-content: space-between;
        gap: 40px;

        height: 26px;
        border: 3px solid currentColor;
        padding: 3px;
      }
      .win-fill {
        width: 100%;
        height: 100%;
        background: #151515;
        transform-origin: 0 50%;
      }
      .win-note {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 22px;
      }
      .win-meter {
        display: flex;
        align-items: flex-end;
        gap: 6px;
      }
      .win-meter > div {
        flex: 1;
        height: 100%;
      }
      .win-ascii {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0.32;
      }
      .win-click {
        position: absolute;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border: 4px solid #6b9bef;
        border-radius: 50%;
        z-index: 4;
      }
      /* The collage look (lib/collage.js): torn tape, paper scraps, stickers over footage; the lyric on tape. */
      .look-collage .caption {
        top: 1336px;
        left: 70px;
        right: 70px;

      .look-collage .capline {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 50px;
        line-height: 1.32;
        gap: 6px 10px;
        text-transform: uppercase;
        color: #141210;

      .look-collage .capline span {
        background: #F6F0E2;
        padding: 0 0.22em;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);

      .look-collage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        background-image:
          repeating-radial-gradient(circle at 17% 23%, rgba(255, 250, 235, 0.05) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.04) 0 1px, transparent 1px 4px);
      }
      /* The arcade look (lib/arcade.js): worlds inside a CRT. */

        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        image-rendering: pixelated;
      }
      .arc-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(5, 6, 14, 0.2) 0%, rgba(5, 6, 14, 0.85) 38%, rgba(5, 6, 14, 0.85) 62%, rgba(5, 6, 14, 0.3) 100%);

      .arc-flash {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
      }

        text-shadow: 0 0 22px currentColor, 0 0 6px currentColor, 0 6px 0 rgba(0, 0, 0, 0.6);

        paint-order: stroke fill;

      .row .arc-sub,

        letter-spacing: 0.32em;
        opacity: 0.85;
      }

        position: relative;
        font-family: "Silkscreen", monospace;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      .arc-glitch span,

        display: block;
        font-weight: 700;
      }
      .arc-glitch span {
        position: absolute;
        left: 0;
        top: 0;
        mix-blend-mode: screen;
      }
      .arc-g-red {
        color: #ff2a3c;
      }
      .arc-g-cyan {
        color: #2ad4ff;
      }
      .arc-glitch strong {
        position: relative;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      }
      svg.arc-line {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 10px rgba(255, 59, 59, 0.8));
      }
      .arc-toast {
        width: 760px;
        border: 6px solid #f4f2ee;
        background: #05060e;
        box-shadow: 10px 10px 0 rgba(255, 59, 59, 0.6);
        font-family: "Silkscreen", monospace;
        font-weight: 700;
        color: #f4f2ee;
        text-transform: uppercase;
        white-space: normal;
      }
      .arc-toast-title {
        background: #c41a1a;
        padding: 10px 22px;
        font-size: 40px;
      }
      .arc-toast-value {
        padding: 22px 22px 8px;
        font-size: 74px;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
      }
      .arc-toast-bar {
        margin: 10px 22px 24px;
        height: 34px;
        border: 5px solid #f4f2ee;
        padding: 4px;
      }
      .arc-toast-fill {
        height: 100%;
        background: #ffc94a;
        transform-origin: 0 50%;
      }
      .arc-toast-note {
        padding: 0 22px 20px;
        font-size: 30px;
        color: #ffc94a;
      }
      .arc-crt-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 958px;
        height: 4px;
        background: #ffffff;
        box-shadow: 0 0 30px 8px rgba(160, 220, 255, 0.9);
        z-index: 8;
      }
      /* Inside the cautious vertical-video safe margins (top 288, right 192, bottom 672 at 1080x1920; the
         video-review check of 2026-11-04): the platform's buttons sit on the right, its caption at the bottom. */
      /* The camera pushes in up to 9 % around the centre, so the stage sits that much further inside the
         margins (top 288 / 1.09 from the centre, right 192 likewise). */
      .look-arcade .stage {
        top: 345px;
        bottom: 830px;
        left: 96px;
        right: 222px;
      }
      .look-arcade .caption {
        top: 1110px;
        height: 130px;
        left: 96px;
        right: 192px;
      }
      .look-arcade .capline {
        font-family: "JetBrains Mono", monospace;
        font-weight: 800;
        font-size: 40px;
        line-height: 1.2;
        text-transform: uppercase;
        color: #f4f2ee;
        -webkit-text-stroke: 8px #05060e;
        paint-order: stroke fill;
      }
      /* The CRT over the whole shot (after the registry's yt-screen-warp): scanlines, pixel grid, glass sheen, vignette. */
      .look-arcade::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.07) 0%, transparent 28%),
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 2px, transparent 2px 5px),
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 1px, transparent 1px 5px);
        box-shadow:
          inset 0 0 220px rgba(0, 0, 0, 0.75),
          inset 0 0 26px rgba(0, 0, 0, 0.6);
      }
